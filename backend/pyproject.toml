[project]
name = "querymind-api"
version = "2.0.0"
description = "QueryMind Library & Book Borrowing API"
readme = "../README.md"
requires-python = ">=3.12,<4"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "sqlmodel>=0.0.22,<1",
    "psycopg[binary]>=3.2,<4",
    "pydantic-settings>=2.5,<3",
    "pydantic[email]>=2.5,<3",
    "bcrypt>=4.1,<5",
    "PyJWT>=2.8,<3",
]

[dependency-groups]
# Only needed for TestClient-based checks; not required at runtime.
dev = ["httpx2>=0.28"]

[tool.uv]
# This is an application, not a library to be installed into the venv.
package = false
